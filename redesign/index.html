<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7edd3">
  <title>우리 동네 포장마차 · 체험판</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#e8eee5}
    body{height:100dvh;display:flex;justify-content:center;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);font-family:system-ui,sans-serif;color:#334b49}
    main{position:relative;width:min(100%,430px);height:100%;background:#f7edd3}
    canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
    .cover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;text-align:center;background:#f7edd3;z-index:2}
    h1{font-size:28px;margin:0 0 12px}p{line-height:1.7;margin:8px 0}progress{width:220px;height:14px;accent-color:#25877a}
    #size-help{z-index:3} [hidden]{display:none!important}
    #version{position:absolute;right:5px;bottom:1px;font-size:8px;opacity:.6;pointer-events:none}
  </style>
</head>
<body>
<main id="game">
  <canvas id="unity-canvas" tabindex="0" aria-label="우리 동네 포장마차 머지 게임"></canvas>
  <section class="cover" id="loading"><h1>우리 동네 포장마차</h1><p>우리 골목에 따뜻한 한 끼를.</p><progress id="progress" max="1" value="0"></progress><p id="load-message">음식을 준비하고 있어요.</p></section>
  <section class="cover" id="size-help" hidden><h1>세로로 플레이해 주세요</h1><p>음식과 손님 메뉴가 잘 보이도록<br>창을 넓히거나 휴대폰을 세워 주세요.</p><p>권장 최소 화면: 360 × 640</p></section>
  <small id="version" hidden>RD-20260925055618</small>
</main>
<script>
  const canvas=document.querySelector('#unity-canvas'), loading=document.querySelector('#loading');
  function fit(){const r=document.querySelector('#game').getBoundingClientRect();document.querySelector('#size-help').hidden=r.width>=360&&Math.min(r.width/6,(r.height-272*r.width/390)/7)>=44;}
  window.addEventListener('resize',fit); if(window.visualViewport)window.visualViewport.addEventListener('resize',fit); fit();
  if(new URLSearchParams(location.search).get('diagnostic')==='1')document.querySelector('#version').hidden=false;
  const buildUrl='Build', version='RD-20260925055618', cache='?v='+encodeURIComponent(version);
  const config={
    dataUrl:buildUrl+'/Redesign.data.unityweb'+cache,
    frameworkUrl:buildUrl+'/Redesign.framework.js.unityweb'+cache,
    codeUrl:buildUrl+'/Redesign.wasm.unityweb'+cache,
    streamingAssetsUrl:'StreamingAssets',
    companyName:"DefaultCompany",
    productName:"KFoodSubwayMerge",
    productVersion:"1.0",
    devicePixelRatio:Math.min(window.devicePixelRatio||1,2),
    showBanner:(message,type)=>{if(type==='error'){loading.hidden=false;document.querySelector('#load-message').textContent='불러오지 못했어요. 새로고침해서 다시 시도해 주세요.';console.error(message);}}
  };
  const script=document.createElement('script');script.src=buildUrl+'/Redesign.loader.js'+cache;
  script.onload=()=>createUnityInstance(canvas,config,value=>document.querySelector('#progress').value=value).then(instance=>{loading.hidden=true;canvas.focus();}).catch(error=>{loading.hidden=false;document.querySelector('#load-message').textContent='불러오지 못했어요. 새로고침해서 다시 시도해 주세요.';console.error(error);});
  script.onerror=()=>{document.querySelector('#load-message').textContent='연결을 확인한 뒤 새로고침해 주세요.';};document.body.appendChild(script);
</script>
</body>
</html>
